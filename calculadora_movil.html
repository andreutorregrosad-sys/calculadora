<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calculadora Pro</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

:root {
  --primary-bg: linear-gradient(135deg, #a000ff 0%, #6a00b8 100%);
  --calc-bg: #1e1e24;
  --display-bg: #111115;
  --display-text: #00ffcc;
  --btn-bg: #2a2a35;
  --btn-text: #ffffff;
  --btn-hover: #3a3a4a;
  --text-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
}

body.light-mode {
  --primary-bg: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
  --calc-bg: #FFFFFF;
  --display-bg: #F5F5F5;
  --display-text: #333333;
  --btn-bg: #E0E0E0;
  --btn-text: #000000;
  --btn-hover: #D0D0D0;
  --text-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: var(--primary-bg);
  padding: 20px;
  transition: background 0.3s ease;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #FFD700, rgba(255, 215, 0, 0)),
    radial-gradient(2px 2px at 60px 70px, #FFD700, rgba(255, 215, 0, 0)),
    radial-gradient(1px 1px at 50px 50px, #FFD700, rgba(255, 215, 0, 0)),
    radial-gradient(1px 1px at 130px 80px, #FFD700, rgba(255, 215, 0, 0)),
    radial-gradient(2px 2px at 90px 10px, #FFD700, rgba(255, 215, 0, 0));
  background-repeat: repeat;
  background-size: 200px 200px;
  animation: twinkle 5s infinite;
  pointer-events: none;
  z-index: 1;
}

body.light-mode::before {
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #9B59B6, rgba(155, 89, 182, 0)),
    radial-gradient(2px 2px at 60px 70px, #9B59B6, rgba(155, 89, 182, 0)),
    radial-gradient(1px 1px at 50px 50px, #9B59B6, rgba(155, 89, 182, 0)),
    radial-gradient(1px 1px at 130px 80px, #9B59B6, rgba(155, 89, 182, 0)),
    radial-gradient(2px 2px at 90px 10px, #9B59B6, rgba(155, 89, 182, 0)),
    radial-gradient(1px 1px at 150px 120px, #8E44AD, rgba(142, 68, 173, 0)),
    radial-gradient(2px 2px at 40px 120px, #8E44AD, rgba(142, 68, 173, 0));
  background-repeat: repeat;
  background-size: 200px 200px;
  animation: twinkle 5s infinite;
}

body > * {
  position: relative;
  z-index: 2;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

.container {
  position: relative;
  display: flex;
  justify-content: center;
  gap: 20px;
  z-index: 10;
}

.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
}

.theme-btn {
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  font-size: 1.5em;
  cursor: pointer;
  background-color: rgba(255, 255, 255, 0.2);
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.theme-btn:hover {
  background-color: rgba(255, 255, 255, 0.3);
  transform: scale(1.1);
}

.calculator {
  background-color: var(--calc-bg);
  padding: 30px;
  border-radius: 24px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
  width: 100%;
  max-width: 400px;
  transition: all 0.3s ease;
}

.display-section {
  position: relative;
  margin-bottom: 22px;
}

.parenthesis-indicator {
  font-size: 0.8em;
  color: var(--display-text);
  height: 16px;
  margin-bottom: 4px;
  visibility: hidden;
  opacity: 0.7;
}

.notation-indicator {
  position: absolute;
  top: 5px;
  right: 10px;
  font-size: 0.7em;
  color: var(--display-text);
  opacity: 0.6;
  display: none;
}

.display {
  width: 100%;
  height: 75px;
  text-align: right;
  font-size: 2.2em;
  padding: 14px 18px;
  border: none;
  border-radius: 12px;
  background-color: var(--display-bg);
  color: var(--display-text);
  text-shadow: var(--text-shadow);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
  transition: all 0.3s ease;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: clip;
  cursor: default;
}

.display:focus {
  outline: none;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.buttons button {
  height: 50px;
  font-size: 1.1em;
  border: none;
  background-color: var(--btn-bg);
  color: var(--btn-text);
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s ease;
  box-shadow: 0 6px 10px rgba(0, 0, 0, 0.18);
  text-transform: uppercase;
}

.buttons .btn-pi,
.buttons .btn-euler {
  text-transform: none;
}

.buttons button:hover {
  background-color: var(--btn-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
}

.buttons button:active {
  transform: translateY(1px);
  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.15);
}

.buttons .equals {
  grid-column: 1 / -1;
  background: linear-gradient(90deg, #00ffcc 0%, #00bfff 100%);
  color: #111115;
  font-size: 1.3em;
  height: 60px;
}

.buttons .equals:hover {
  background: linear-gradient(90deg, #00ecc2 0%, #00aee3 100%);
  box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
}

body.light-mode .buttons .equals {
  background: linear-gradient(90deg, #FF6B6B 0%, #FF8E8E 100%);
  color: #FFFFFF;
}

body.light-mode .buttons .equals:hover {
  background: linear-gradient(90deg, #FF8585 0%, #FFA5A5 100%);
}

.buttons .btn-copy {
  background: linear-gradient(90deg, #f39c12 0%, #e67e22 100%);
  color: #111115;
}

.buttons .btn-copy:hover {
  background: linear-gradient(90deg, #f5b041 0%, #eb984e 100%);
}

body.light-mode .buttons .btn-copy {
  background: linear-gradient(90deg, #FF9500 0%, #FF7F00 100%);
  color: #FFFFFF;
}

body.light-mode .buttons .btn-copy:hover {
  background: linear-gradient(90deg, #FFB000 0%, #FF9000 100%);
}

.buttons .btn-history {
  background: linear-gradient(90deg, #3498db 0%, #2980b9 100%);
  color: white;
}

.buttons .btn-history:hover {
  background: linear-gradient(90deg, #5dade2 0%, #2e86c1 100%);
}

body.light-mode .buttons .btn-history {
  background: linear-gradient(90deg, #3498db 0%, #2980b9 100%);
  color: white;
}

.buttons .btn-fi {
  background-color: #FF8C00;
  color: #111111;
}

.buttons .btn-fi:hover {
  background-color: #ff9f2d;
}

body.light-mode .buttons .btn-fi {
  background-color: #FF8C00;
  color: #FFFFFF;
}

body.light-mode .buttons .btn-fi:hover {
  background-color: #ff9f2d;
}

.buttons .btn-pi {
  background-color: #8E44AD;
  color: #ffffff;
}

.buttons .btn-pi:hover {
  background-color: #9b59b6;
}

body.light-mode .buttons .btn-pi {
  background-color: #8E44AD;
  color: #FFFFFF;
}

body.light-mode .buttons .btn-pi:hover {
  background-color: #9b59b6;
}

.buttons .btn-euler {
  background-color: #1ABC9C;
  color: #0b3b34;
}

.buttons .btn-euler:hover {
  background-color: #48c9b0;
}

body.light-mode .buttons .btn-euler {
  background-color: #1ABC9C;
  color: #FFFFFF;
}

body.light-mode .buttons .btn-euler:hover {
  background-color: #48c9b0;
}

.buttons .btn-notation {
  background: linear-gradient(90deg, #e74c3c 0%, #c0392b 100%);
  color: white;
}

.buttons .btn-notation:hover {
  background: linear-gradient(90deg, #ec7063 0%, #cb4335 100%);
}

.buttons .btn-inf {
  background: linear-gradient(90deg, #000000 0%, #222222 100%);
  color: #FFD700;
  border: 1px solid #ffffff;
  box-shadow: 0 0 14px rgba(255, 215, 0, 0.35);
}

.buttons .btn-inf:hover {
  background: linear-gradient(90deg, #111111 0%, #2a2a2a 100%);
  color: #FFD700;
  box-shadow: 0 0 24px rgba(255, 215, 0, 0.45);
}

body.light-mode .buttons .btn-inf {
  background: linear-gradient(90deg, #FFFFFF 0%, #F0F0F0 100%);
  color: #FFD700;
  border: 2px solid #000000;
  box-shadow: 0 0 14px rgba(0, 0, 0, 0.35);
}

body.light-mode .buttons .btn-inf:hover {
  background: linear-gradient(90deg, #F5F5F5 0%, #EBEBEB 100%);
  color: #FFD700;
  box-shadow: 0 0 24px rgba(0, 0, 0, 0.45);
}

.buttons .btn-frac,
.buttons .btn-spec {
  background-color: #4a4a5a;
  color: #00ffcc;
}

.buttons .btn-frac:hover,
.buttons .btn-spec:hover {
  background-color: #5a5a6a;
}

body.light-mode .buttons .btn-frac,
body.light-mode .buttons .btn-spec {
  background-color: #CCCCCC;
  color: #0099AA;
}

body.light-mode .buttons .btn-frac:hover,
body.light-mode .buttons .btn-spec:hover {
  background-color: #BBBBBB;
}

.buttons .btn-backspace {
  background-color: #e74c3c;
  color: white;
}

.buttons .btn-backspace:hover {
  background-color: #ff6b5b;
}

body.light-mode .buttons .btn-backspace {
  background-color: #e74c3c;
  color: white;
}

body.light-mode .buttons .btn-backspace:hover {
  background-color: #ff6b5b;
}

.buttons .btn-clear {
  background-color: #27ae60;
  color: white;
}

.buttons .btn-clear:hover {
  background-color: #2ecc71;
}

body.light-mode .buttons .btn-clear {
  background-color: #27ae60;
  color: white;
}

body.light-mode .buttons .btn-clear:hover {
  background-color: #2ecc71;
}

.buttons .btn-div {
  background-color: #f39c12;
  color: #111115;
}

.buttons .btn-div:hover {
  background-color: #f1c40f;
}

body.light-mode .buttons .btn-div {
  background-color: #f39c12;
  color: #FFFFFF;
}

body.light-mode .buttons .btn-div:hover {
  background-color: #f1c40f;
}

/* Historial */
.history-panel {
  background-color: var(--calc-bg);
  padding: 20px;
  border-radius: 24px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
  width: 100%;
  max-width: 300px;
  max-height: 600px;
  overflow-y: auto;
  display: none;
  transition: all 0.3s ease;
}

.history-panel.show {
  display: block;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  color: var(--display-text);
}

.history-header h3 {
  font-size: 1.1em;
}

.btn-clear-history {
  background-color: #e74c3c;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.8em;
  transition: all 0.2s ease;
}

.btn-clear-history:hover {
  background-color: #ff6b5b;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-item {
  background-color: var(--btn-bg);
  color: var(--display-text);
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9em;
  transition: all 0.2s ease;
  border-left: 3px solid transparent;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-item:hover {
  background-color: var(--btn-hover);
  border-left-color: #00ffcc;
  transform: translateX(5px);
}

body.light-mode .history-item:hover {
  border-left-color: #FF6B6B;
}

/* Conversor de bases */
.buttons .btn-base {
  grid-column: 1 / -1;
  height: 44px;
  background: linear-gradient(90deg, #9b59b6 0%, #6c3483 100%);
  color: #ffffff;
  letter-spacing: 0.04em;
}

.buttons .btn-base:hover {
  background: linear-gradient(90deg, #af7ac5 0%, #7d3c98 100%);
}

.base-panel {
  background-color: var(--calc-bg);
  color: var(--display-text);
  padding: 20px;
  border-radius: 24px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
  width: 100%;
  max-width: 340px;
  max-height: 600px;
  overflow-y: auto;
  display: none;
}

.base-panel.show {
  display: block;
}

.base-panel h3 {
  font-size: 1.1em;
  margin-bottom: 12px;
}

.base-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
  font-size: 0.85em;
}

.base-panel input,
.base-panel select {
  width: 100%;
  padding: 9px 10px;
  border: none;
  border-radius: 8px;
  background-color: var(--display-bg);
  color: var(--display-text);
  font-size: 1em;
  font-family: 'Consolas', 'Courier New', monospace;
}

.base-panel input:focus,
.base-panel select:focus {
  outline: 2px solid #9b59b6;
}

.base-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.base-actions button {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 8px;
  background-color: var(--btn-bg);
  color: var(--btn-text);
  font-size: 0.8em;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

.base-actions button:hover {
  background-color: var(--btn-hover);
}

.base-error {
  min-height: 1.2em;
  margin-bottom: 8px;
  font-size: 0.8em;
  color: #e74c3c;
}

.base-row {
  background-color: var(--btn-bg);
  padding: 9px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.2s ease;
}

.base-row:hover {
  background-color: var(--btn-hover);
  border-left-color: #9b59b6;
}

.base-row .base-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75em;
  opacity: 0.75;
  margin-bottom: 2px;
}

.base-row .base-value {
  font-family: 'Consolas', 'Courier New', monospace;
  word-break: break-all;
  min-height: 1.2em;
}

/* Responsividad */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .calculator {
    padding: 20px;
    width: 100%;
    max-width: 350px;
  }

  .buttons {
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .buttons button {
    height: 45px;
    font-size: 1em;
  }

  .display {
    height: 65px;
    font-size: 1.8em;
  }

  .history-panel,
  .base-panel {
    max-width: 100%;
  }

  .theme-btn {
    width: 40px;
    height: 40px;
    font-size: 1.2em;
  }
}

@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  .calculator {
    padding: 15px;
    width: 100%;
    max-width: 100%;
  }

  .buttons {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .buttons button {
    height: 40px;
    font-size: 0.9em;
  }

  .display {
    height: 55px;
    font-size: 1.5em;
    padding: 10px;
  }

  .history-panel {
    max-height: 400px;
  }

  .theme-btn {
    width: 35px;
    height: 35px;
    top: 10px;
    right: 10px;
    font-size: 1em;
  }
}

/* Scroll personalizado para historial */
.history-panel::-webkit-scrollbar {
  width: 8px;
}

.history-panel::-webkit-scrollbar-track {
  background: var(--btn-bg);
  border-radius: 10px;
}

.history-panel::-webkit-scrollbar-thumb {
  background: #00ffcc;
  border-radius: 10px;
}

.history-panel::-webkit-scrollbar-thumb:hover {
  background: #00bfff;
}

body.light-mode .history-panel::-webkit-scrollbar-thumb {
  background: #FF6B6B;
}

body.light-mode .history-panel::-webkit-scrollbar-thumb:hover {
  background: #FF8585;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="theme-toggle">
      <button id="themeBtn" class="theme-btn" aria-label="Cambiar tema">🌙</button>
    </div>

    <div class="calculator">
      <div class="display-section">
        <div class="parenthesis-indicator" id="parenIndicator"></div>
        <input type="text" class="display" id="display" value="0" readonly tabindex="-1" aria-label="Pantalla">
        <div class="notation-indicator" id="notationIndicator"></div>
      </div>

      <div class="buttons">
        <!-- Fila 1: Constantes y funciones especiales -->
        <button onclick="appendToken('Φ')" class="btn-fi">Φ</button>
        <button onclick="appendToken('π')" class="btn-pi">π</button>
        <button onclick="appendToken('e')" class="btn-euler">e</button>
        <button onclick="toggleScientificNotation()" class="btn-notation">E</button>
        <button onclick="backspace()" class="btn-backspace">⌫</button>

        <!-- Fila 2: Trigonométricas y funciones -->
        <button onclick="appendFunction('sin')">sin</button>
        <button onclick="appendFunction('cos')">cos</button>
        <button onclick="appendFunction('tan')">tan</button>
        <button onclick="appendFunction('log')">log</button>
        <button onclick="appendFunction('ln')">ln</button>

        <!-- Fila 3 -->
        <button onclick="appendToken('1')">1</button>
        <button onclick="appendToken('2')">2</button>
        <button onclick="appendToken('3')">3</button>
        <button onclick="appendToken('+')">+</button>
        <button onclick="appendToken('(')">(</button>

        <!-- Fila 4 -->
        <button onclick="appendToken('4')">4</button>
        <button onclick="appendToken('5')">5</button>
        <button onclick="appendToken('6')">6</button>
        <button onclick="appendToken('-')">-</button>
        <button onclick="appendToken(')')">)</button>

        <!-- Fila 5 -->
        <button onclick="appendToken('7')">7</button>
        <button onclick="appendToken('8')">8</button>
        <button onclick="appendToken('9')">9</button>
        <button onclick="appendToken('×')">×</button>
        <button onclick="appendToken('^')">^</button>

        <!-- Fila 6: Funciones especiales -->
        <button onclick="appendFactorial()" class="btn-spec">!</button>
        <button onclick="appendPercentage()" class="btn-spec">%</button>
        <button onclick="appendToken('0')">0</button>
        <button onclick="appendToken('.')">.</button>
        <button onclick="appendSqrt()" class="btn-spec">√</button>

        <!-- Fila 7: Acciones principales -->
        <button onclick="clearDisplay()" class="btn-clear">C</button>
        <button onclick="appendToken('/')" class="btn-div">/</button>
        <button onclick="copyResult()" class="btn-copy">📋</button>
        <button onclick="toggleHistory()" class="btn-history">📜</button>
        <button onclick="appendInfinity()" id="infinityBtn" class="btn-inf">∞</button>

        <button onclick="toggleBase()" class="btn-base">BASE · bin / oct / dec / hex</button>
        <button onclick="calculate()" class="equals">=</button>
      </div>
    </div>

    <!-- Conversor de bases -->
    <div class="base-panel" id="basePanel">
      <h3>Conversor de bases</h3>

      <label class="base-field">Número
        <input type="text" id="baseInput" placeholder="Ej: 1010, FF, 255" autocomplete="off" spellcheck="false">
      </label>
      <label class="base-field">Base del número
        <select id="baseFrom"></select>
      </label>

      <div class="base-actions">
        <button onclick="baseFromDisplay()">Usar pantalla</button>
        <button onclick="baseToDisplay()">Enviar a pantalla</button>
      </div>

      <div class="base-error" id="baseError"></div>

      <div class="base-row" data-out="bin" title="Clic para copiar">
        <div class="base-label">Binario (2)</div>
        <div class="base-value" id="outBin"></div>
      </div>
      <div class="base-row" data-out="oct" title="Clic para copiar">
        <div class="base-label">Octal (8)</div>
        <div class="base-value" id="outOct"></div>
      </div>
      <div class="base-row" data-out="dec" title="Clic para copiar">
        <div class="base-label">Decimal (10)</div>
        <div class="base-value" id="outDec"></div>
      </div>
      <div class="base-row" data-out="hex" title="Clic para copiar">
        <div class="base-label">Hexadecimal (16)</div>
        <div class="base-value" id="outHex"></div>
      </div>
    </div>

    <!-- Historial -->
    <div class="history-panel" id="historyPanel">
      <div class="history-header">
        <h3>Historial</h3>
        <button onclick="clearHistory()" class="btn-clear-history">Limpiar</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
function storageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { }
}

let expr = '';
let justEvaluated = false;
let hasError = false;
let useScientificNotation = false;
let lightMode = storageGet('lightMode') === 'true';
let calcHistory = loadHistory();

const OPS = ['+', '-', '×', '/', '^'];
const OPS_REGEX_END = /[+\-×\/^]+$/;
const CONSTANTS = {
  'π': Math.PI,
  'e': Math.E,
  'Φ': (1 + Math.sqrt(5)) / 2,
  '∞': Infinity
};

function loadHistory() {
  try {
    const data = JSON.parse(storageGet('calculatorHistory') || '[]');
    if (!Array.isArray(data)) return [];
    return data
      .filter(e => e && typeof e.expr === 'string' && typeof e.result === 'string')
      .slice(0, 50);
  } catch (e) {
    return [];
  }
}

const themeBtn = document.getElementById('themeBtn');
if (lightMode) document.body.classList.add('light-mode');
themeBtn.textContent = lightMode ? '🌙' : '☀️';

themeBtn.addEventListener('click', function () {
  lightMode = !lightMode;
  storageSet('lightMode', lightMode);
  document.body.classList.toggle('light-mode', lightMode);
  this.textContent = lightMode ? '🌙' : '☀️';
});

document.addEventListener('keydown', function (event) {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.target.closest && event.target.closest('#themeBtn, .btn-clear-history, #basePanel')) return;

  const key = event.key;

  // Teclado español: ^ es Shift + tecla muerta (event.key === 'Dead')
  if (key === 'Dead' && event.shiftKey && event.code === 'BracketLeft') {
    event.preventDefault();
    appendToken('^');
    return;
  }

  if (/^[0-9]$/.test(key)) {
    appendToken(key);
  } else if (key === '.' || key === ',') {
    appendToken('.');
  } else if (['+', '-', '/', '^', '(', ')'].includes(key)) {
    appendToken(key);
  } else if (key === '*' || key === 'x' || key === 'X') {
    appendToken('×');
  } else if (key === '!') {
    appendFactorial();
  } else if (key === '%') {
    appendPercentage();
  } else if (key === 'Enter' || key === '=') {
    event.preventDefault();
    calculate();
  } else if (key === 'Escape' || key === 'c' || key === 'C') {
    clearDisplay();
  } else if (key === 'Backspace') {
    event.preventDefault();
    backspace();
  }
});

function updateDisplay() {
  const display = document.getElementById('display');
  display.value = expr === '' ? '0' : expr;
  display.scrollLeft = display.scrollWidth;
  updateParenthesisIndicator();
  updateNotationIndicator();
}

function countParens() {
  const open = (expr.match(/\(/g) || []).length;
  const close = (expr.match(/\)/g) || []).length;
  return { open, close };
}

function updateParenthesisIndicator() {
  const { open, close } = countParens();
  const indicator = document.getElementById('parenIndicator');
  if (open > close) {
    indicator.textContent = `( × ${open - close}`;
    indicator.style.visibility = 'visible';
  } else {
    indicator.style.visibility = 'hidden';
  }
}

function updateNotationIndicator() {
  const indicator = document.getElementById('notationIndicator');
  if (useScientificNotation) {
    indicator.textContent = 'Científica';
    indicator.style.display = 'block';
  } else {
    indicator.style.display = 'none';
  }
}

function prepareForInput(startsNewValue) {
  if (hasError) {
    expr = '';
    hasError = false;
    justEvaluated = false;
  } else if (justEvaluated) {
    if (startsNewValue) expr = '';
    justEvaluated = false;
  }
}

function appendDigit(d) {
  prepareForInput(true);
  const segment = expr.match(/[\d.]*$/)[0];
  if (segment === '0') {
    expr = expr.slice(0, -1) + d;
  } else {
    expr += d;
  }
}

function appendDecimal() {
  prepareForInput(true);
  const segment = expr.match(/[\d.]*$/)[0];
  if (segment.includes('.')) return;
  expr += segment === '' ? '0.' : '.';
}

function appendOperator(op) {
  prepareForInput(false);
  if (expr === '') {
    if (op === '-') expr = '-';
    return;
  }
  const last = expr.slice(-1);
  if (last === '(') {
    if (op === '-') expr += op;
    return;
  }
  if (OPS.includes(last)) {
    if (op === '-' && ['×', '/', '^'].includes(last)) {
      expr += op;
    } else {
      const base = expr.replace(OPS_REGEX_END, '');
      if (base === '' || base.endsWith('(')) {
        expr = op === '-' ? base + '-' : base;
      } else {
        expr = base + op;
      }
    }
    return;
  }
  expr += op;
}

function appendOpenParen() {
  prepareForInput(true);
  expr += '(';
}

function appendCloseParen() {
  prepareForInput(false);
  const { open, close } = countParens();
  if (open <= close) return;
  const last = expr.slice(-1);
  if (last === '' || last === '(' || OPS.includes(last)) return;
  expr += ')';
}

function appendConstant(symbol) {
  prepareForInput(true);
  expr += symbol;
}

function appendToken(token) {
  if (token === '*') token = '×';
  if (/^\d$/.test(token)) appendDigit(token);
  else if (token === '.') appendDecimal();
  else if (OPS.includes(token)) appendOperator(token);
  else if (token === '(') appendOpenParen();
  else if (token === ')') appendCloseParen();
  else if (Object.prototype.hasOwnProperty.call(CONSTANTS, token)) appendConstant(token);
  updateDisplay();
}

function applyFunctionToken(name) {
  if (justEvaluated && !hasError && expr !== '') {
    // Hay un resultado en pantalla: se aplica la función a ese valor
    expr = `${name}(${expr})`;
    justEvaluated = false;
  } else {
    prepareForInput(true);
    expr += `${name}(`;
  }
  updateDisplay();
}

function appendFunction(name) { applyFunctionToken(name); }
function appendSqrt() { applyFunctionToken('√'); }

function appendInfinity() {
  appendToken('∞');
}

function appendPostfix(symbol) {
  if (hasError || expr === '') return;
  const last = expr.slice(-1);
  if (last === '(' || OPS.includes(last)) return;
  justEvaluated = false;
  expr += symbol;
  updateDisplay();
}

function appendFactorial() { appendPostfix('!'); }
function appendPercentage() { appendPostfix('%'); }

function toggleScientificNotation() {
  useScientificNotation = !useScientificNotation;
  if (justEvaluated && !hasError) {
    try { expr = formatResult(evaluate(expr)); } catch (e) { }
  }
  updateDisplay();
}

function backspace() {
  if (hasError) {
    clearDisplay();
    return;
  }
  justEvaluated = false;
  expr = expr.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|√\(|.)$/, '');
  updateDisplay();
}

function clearDisplay() {
  expr = '';
  hasError = false;
  justEvaluated = false;
  updateDisplay();
}

function factorial(n) {
  if (n === Infinity) return Infinity;
  if (!Number.isInteger(n) || n < 0) return NaN;
  if (n > 170) return Infinity;
  let result = 1;
  for (let i = 2; i <= n; i++) result *= i;
  return result;
}

function tokenize(s) {
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const rest = s.slice(i);
    let m;
    if ((m = rest.match(/^(\d+\.?\d*|\.\d+)/))) {
      tokens.push({ t: 'num', v: parseFloat(m[0]) });
      i += m[0].length;
    } else if ((m = rest.match(/^(sin|cos|tan|log|ln|√)\(/))) {
      tokens.push({ t: 'func', v: m[1] });
      i += m[0].length;
    } else if (Object.prototype.hasOwnProperty.call(CONSTANTS, rest[0])) {
      tokens.push({ t: 'num', v: CONSTANTS[rest[0]] });
      i += 1;
    } else if ('+-×/^()!%'.includes(rest[0])) {
      tokens.push({ t: rest[0] });
      i += 1;
    } else {
      throw new Error('Carácter no válido');
    }
  }
  return tokens;
}

// Elimina el ruido de coma flotante (p. ej. sin(π) = 1.2e-16 -> 0)
const cleanTrig = fn => x => {
  const r = fn(x);
  return Math.abs(r) < 1e-14 ? 0 : r;
};

const FUNCTIONS = {
  'sin': cleanTrig(Math.sin),
  'cos': cleanTrig(Math.cos),
  'tan': cleanTrig(Math.tan),
  'log': Math.log10,
  'ln': Math.log,
  '√': Math.sqrt
};

function evaluate(s) {
  const tokens = tokenize(s);
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];

  function parseExpr() {
    let v = parseTerm();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = next().t;
      const r = parseTerm();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }

  function startsOperand(tok) {
    return tok && (tok.t === 'num' || tok.t === 'func' || tok.t === '(');
  }

  function parseTerm() {
    let v = parseUnary();
    for (;;) {
      const tk = peek();
      if (!tk) break;
      if (tk.t === '×') { next(); v *= parseUnary(); }
      else if (tk.t === '/') { next(); v /= parseUnary(); }
      else if (startsOperand(tk)) { v *= parseUnary(); }
      else break;
    }
    return v;
  }

  function parseUnary() {
    const tk = peek();
    if (tk && tk.t === '-') { next(); return -parseUnary(); }
    if (tk && tk.t === '+') { next(); return parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    const base = parsePostfix();
    if (peek() && peek().t === '^') {
      next();
      return Math.pow(base, parseExponent());
    }
    return base;
  }

  function parseExponent() {
    const tk = peek();
    if (tk && tk.t === '-') { next(); return -parseExponent(); }
    if (tk && tk.t === '+') { next(); return parseExponent(); }
    return parsePower();
  }

  function parsePostfix() {
    let v = parsePrimary();
    while (peek() && (peek().t === '!' || peek().t === '%')) {
      v = next().t === '!' ? factorial(v) : v / 100;
    }
    return v;
  }

  function closeParen() {
    if (peek() && peek().t === ')') next();
    else if (peek()) throw new Error('Expresión no válida');
  }

  function parsePrimary() {
    const tk = next();
    if (!tk) throw new Error('Expresión incompleta');
    if (tk.t === 'num') return tk.v;
    if (tk.t === 'func') {
      const arg = parseExpr();
      closeParen();
      return FUNCTIONS[tk.v](arg);
    }
    if (tk.t === '(') {
      const v = parseExpr();
      closeParen();
      return v;
    }
    throw new Error('Expresión no válida');
  }

  const result = parseExpr();
  if (pos < tokens.length) throw new Error('Expresión no válida');
  return result;
}

function formatResult(r) {
  if (r === Infinity) return '∞';
  if (r === -Infinity) return '-∞';
  const rounded = parseFloat(r.toPrecision(12));
  const plain = String(rounded);
  const needsExponent = (useScientificNotation && Math.abs(rounded) >= 1e6) || plain.includes('e');
  if (!needsExponent) return plain;
  let [mantissa, exponent] = rounded.toExponential(6).split('e');
  mantissa = mantissa.replace(/\.?0+$/, '');
  return `${mantissa}×10^${parseInt(exponent, 10)}`;
}

function showError() {
  hasError = true;
  justEvaluated = false;
  expr = 'Error';
  updateDisplay();
}

function calculate() {
  if (expr === '' || hasError || justEvaluated) return;

  let result;
  try {
    result = evaluate(expr);
  } catch (e) {
    showError();
    return;
  }
  if (typeof result !== 'number' || Number.isNaN(result)) {
    showError();
    return;
  }

  const text = formatResult(result);
  addToHistory(expr, text);
  expr = text;
  justEvaluated = true;
  updateDisplay();
}

function copyResult() {
  if (expr === '' || hasError) return;
  const value = expr;
  const btn = document.querySelector('.btn-copy');
  const done = () => {
    const old = btn.textContent;
    btn.textContent = '✅';
    setTimeout(() => { btn.textContent = old; }, 1000);
  };
  const fallback = () => {
    const temp = document.createElement('textarea');
    temp.value = value;
    document.body.appendChild(temp);
    temp.select();
    try { if (document.execCommand('copy')) done(); } catch (e) { }
    document.body.removeChild(temp);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(value).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function addToHistory(expression, result) {
  calcHistory.unshift({ expr: expression, result: result });
  if (calcHistory.length > 50) calcHistory.pop();
  storageSet('calculatorHistory', JSON.stringify(calcHistory));
  updateHistoryDisplay();
}

function toggleHistory() {
  document.getElementById('historyPanel').classList.toggle('show');
}

function clearHistory() {
  calcHistory = [];
  storageSet('calculatorHistory', JSON.stringify(calcHistory));
  updateHistoryDisplay();
}

function updateHistoryDisplay() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  calcHistory.forEach((entry, index) => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.dataset.index = index;
    item.textContent = `${entry.expr} = ${entry.result}`;
    item.title = item.textContent;
    list.appendChild(item);
  });
}

document.getElementById('historyList').addEventListener('click', function (event) {
  const item = event.target.closest('.history-item');
  if (!item) return;
  const entry = calcHistory[Number(item.dataset.index)];
  if (!entry) return;
  expr = entry.result;
  hasError = false;
  justEvaluated = true;
  updateDisplay();
});

const BASE_DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';
const BASE_NAMES = { 2: 'Binario', 8: 'Octal', 10: 'Decimal', 16: 'Hexadecimal' };
let baseValue = null;
let baseRaw = {};

function toggleBase() {
  document.getElementById('basePanel').classList.toggle('show');
}

function parseInBase(text, base) {
  let s = text.trim().replace(/[\s_]/g, '').toLowerCase();
  if (s === '') return null;
  let negative = false;
  if (s[0] === '-') { negative = true; s = s.slice(1); }
  else if (s[0] === '+') { s = s.slice(1); }
  if (base === 16 && s.startsWith('0x')) s = s.slice(2);
  if (base === 2 && s.startsWith('0b')) s = s.slice(2);
  if (base === 8 && s.startsWith('0o')) s = s.slice(2);
  if (s === '') throw new Error('Falta el número');

  const B = BigInt(base);
  let value = 0n;
  for (const ch of s) {
    const d = BASE_DIGITS.indexOf(ch);
    if (d < 0 || d >= base) {
      throw new Error(`"${ch.toUpperCase()}" no es un dígito válido en base ${base}`);
    }
    value = value * B + BigInt(d);
  }
  return negative ? -value : value;
}

function groupBinary(str) {
  const sign = str.startsWith('-') ? '-' : '';
  const digits = sign ? str.slice(1) : str;
  return sign + digits.replace(/\B(?=(\d{4})+(?!\d))/g, ' ');
}

function setBaseOutputs(value) {
  const map = {
    bin: [2, 'outBin'], oct: [8, 'outOct'], dec: [10, 'outDec'],
    hex: [16, 'outHex']
  };
  baseRaw = {};
  for (const key in map) {
    const [b, id] = map[key];
    const el = document.getElementById(id);
    if (value === null) {
      el.textContent = '';
      continue;
    }
    const raw = value.toString(b).toUpperCase();
    baseRaw[key] = raw;
    el.textContent = key === 'bin' ? groupBinary(raw) : raw;
  }
}

function updateBase() {
  const error = document.getElementById('baseError');
  const from = parseInt(document.getElementById('baseFrom').value, 10);
  error.textContent = '';
  try {
    baseValue = parseInBase(document.getElementById('baseInput').value, from);
  } catch (e) {
    baseValue = null;
    error.textContent = e.message;
  }
  setBaseOutputs(baseValue);
}

function baseFromDisplay() {
  const error = document.getElementById('baseError');
  try {
    if (hasError || expr === '') throw new Error('No hay nada en la pantalla');
    const r = evaluate(expr);
    if (!Number.isFinite(r) || !Number.isInteger(r)) throw new Error('La pantalla no contiene un número entero');
    if (Math.abs(r) > Number.MAX_SAFE_INTEGER) throw new Error('El número es demasiado grande para leerlo de la pantalla');
    document.getElementById('baseFrom').value = '10';
    document.getElementById('baseInput').value = String(r);
    updateBase();
  } catch (e) {
    error.textContent = e.message;
  }
}

function baseToDisplay() {
  if (baseValue === null) return;
  expr = baseValue.toString(10);
  hasError = false;
  justEvaluated = true;
  updateDisplay();
}

function copyText(value, done) {
  const fallback = () => {
    const temp = document.createElement('textarea');
    temp.value = value;
    document.body.appendChild(temp);
    temp.select();
    try { if (document.execCommand('copy')) done(); } catch (e) { }
    document.body.removeChild(temp);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(value).then(done).catch(fallback);
  } else {
    fallback();
  }
}

(function initBasePanel() {
  const select = document.getElementById('baseFrom');
  for (const b of [2, 8, 10, 16]) {
    const opt = document.createElement('option');
    opt.value = b;
    opt.textContent = `${BASE_NAMES[b]} (${b})`;
    select.appendChild(opt);
  }
  select.value = '10';

  document.getElementById('baseInput').addEventListener('input', updateBase);
  select.addEventListener('change', updateBase);

  document.getElementById('basePanel').addEventListener('click', function (event) {
    const row = event.target.closest('.base-row');
    if (!row || event.target.closest('input')) return;
    const raw = baseRaw[row.dataset.out];
    if (!raw) return;
    const label = row.querySelector('.base-value');
    copyText(raw, () => {
      const old = label.textContent;
      label.textContent = 'Copiado ✓';
      setTimeout(() => { label.textContent = old; }, 800);
    });
  });
})();

updateHistoryDisplay();
updateDisplay();

  </script>
